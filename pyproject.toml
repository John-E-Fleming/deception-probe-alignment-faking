[project]
name = "deception-probe-alignment-faking"
version = "0.1.0"
description = "Testing whether deception probes trained on instructed deception generalise to naturally-emerging alignment faking"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core ML
    # torch is upper-bounded so we land on a CUDA 12.6 wheel — RunPod hosts
    # commonly ship NVIDIA driver 12.6–12.8 and can't run torch wheels built
    # against CUDA 13.0+. See [tool.uv.sources] below for the index routing.
    "torch>=2.4.0,<2.9",
    "transformers>=4.51,<5",
    "accelerate>=1.0.0",
    # nnsight removed: activation extraction now delegates to Apollo's
    # deception_detection.activations.Activations.from_model via HF transformers
    # with output_hidden_states=True. See alignment_faking_probes.data.activation_extraction.

    # Probe training & evaluation
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",

    # Data handling
    "pandas>=2.2.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.24.0",
    "pyyaml>=6.0.1",

    # Experiment tracking & plotting
    "wandb>=0.18.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",

    # Utilities
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",

    # Quantisation backend for 4-bit / 8-bit model loading. Linux-only —
    # bitsandbytes has no Windows wheels; the marker keeps `uv sync` working
    # for local CPU-only dev on Windows.
    "bitsandbytes>=0.43; sys_platform == 'linux'",

    # Apollo deception-detection transitive deps. Apollo itself is installed
    # editable on RunPod via `scripts/00_runpod_setup.sh --no-deps` (its
    # torch<2.3 pin would otherwise conflict with our torch>=2.4). But Apollo
    # imports all of these unconditionally — most via its eager
    # `deception_detection/data/__init__.py` which chain-imports every
    # scenario module — so we list them as Linux-only deps here so `uv sync`
    # keeps them across reinstalls instead of dropping them. Excluded:
    # streamlit / circuitsvis (heavy UI/viz, unused by our extraction path)
    # and torchvision (pinned to ~=0.17.0 by Apollo, would conflict).
    "peft>=0.10; sys_platform == 'linux'",
    "jaxtyping>=0.2.29; sys_platform == 'linux'",
    "einops>=0.7; sys_platform == 'linux'",
    "pydantic>=2.0; sys_platform == 'linux'",
    "fire>=0.5; sys_platform == 'linux'",
    "tabulate; sys_platform == 'linux'",
    "anthropic; sys_platform == 'linux'",
    "openai; sys_platform == 'linux'",
    "inspect-ai>=0.3.41; sys_platform == 'linux'",
    "sae-lens>=3.19.0; sys_platform == 'linux'",
    "plotly; sys_platform == 'linux'",
    "together>=1.3.1; sys_platform == 'linux'",
    "goodfire; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

# Apollo deception-detection is NOT managed by uv.
# Apollo pins torch>=2.2.0,<2.3.dev0, which conflicts with this project's
# torch>=2.4.0 requirement and has no wheels for Python 3.13.
# Install on RunPod separately:
#     cd /workspace
#     git clone https://github.com/ApolloResearch/deception-detection
#     cd deception-detection && git checkout f8ec4010e74927394709dffa22b97bdf8cd5a62f
#     pip install -e .
#     export PYTHONPATH="/workspace/deception-detection:$PYTHONPATH"
# Pinned commit: f8ec4010e74927394709dffa22b97bdf8cd5a62f
# This commit hash must be logged in every W&B run and in results/experiment_metadata.json.
# See README RunPod setup section for full instructions.

# Route torch through the CUDA 12.6 PyTorch index on Linux. RunPod hosts commonly
# ship NVIDIA driver 12.6–12.8 which can't run torch built against CUDA 13.0+
# (driver version is NOT forward-compatible across major CUDA versions).
# Windows / macOS fall back to PyPI defaults — local dev doesn't need GPU torch.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alignment_faking_probes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]